[versions]
kotlin = "2.3.21"
ktor = "3.6.0"
kotlinx-io = "0.9.1"
kotlinx-coroutines = "1.11.0"
kotlinx-datetime = "0.8.0"
testcontainers = "1.21.4"
junit5 = "5.13.4"
whyoleg-cryptography = "0.6.0"
nexus-publish = "2.0.0"

[libraries]
ktor-network = { group = "io.ktor", name = "ktor-network", version.ref = "ktor" }
kotlinx-io-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-io-core", version.ref = "kotlinx-io" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinx-datetime" }
testcontainers-postgresql = { group = "org.testcontainers", name = "postgresql", version.ref = "testcontainers" }
testcontainers-junit = { group = "org.testcontainers", name = "junit-jupiter", version.ref = "testcontainers" }
junit5 = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit5" }
junit5-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junit5" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test" }
kotlin-test-junit5 = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit5", version.ref = "kotlin" }
whyoleg-cryptography-core = { group = "dev.whyoleg.cryptography", name = "cryptography-core", version.ref = "whyoleg-cryptography" }
whyoleg-cryptography-optimal = { group = "dev.whyoleg.cryptography", name = "cryptography-provider-optimal", version.ref = "whyoleg-cryptography" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
nexus-publish = { id = "io.github.gradle-nexus.publish-plugin", version.ref = "nexus-publish" }